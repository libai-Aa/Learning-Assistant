identifier = "allow-all-commands"
description = "允许所有自定义应用命令"
commands.allow = [
    "get_data_dir",
    "ensure_data_dir",
    "fetch_url",
    "download_image",
    "read_json_file",
    "write_json_file",
    "write_binary_file",
    "llm_chat",
    "fetch_image_base64",
    "open_file",
    "read_file_content",
    "readfilecontent",
    "list_files",
    "delete_data_file",
