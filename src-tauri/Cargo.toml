[package]
name = "llm-wiki"
version = "0.3.13"
edition = "2021"

[lib]
name = "llm_wiki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "5"
reqwest = { version = "0.12", features = ["blocking", "multipart"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
url = "2"
